<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laxmi Job Alert — सरकारी नौकरियाँ</title>
<meta name="description" content="SSC, RSMSSB, RSSB की नवीनतम भर्ती सूचनाएं, परिणाम, एडमिट कार्ड और आंसर की।">
<meta name="robots" content="index, follow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com wss://*.googleapis.com https://firestore.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebaseinstallations.googleapis.com https://*.firebasestorage.app https://*.firebaseio.com wss://*.firebaseio.com; frame-src 'none'; object-src 'none'; base-uri 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --blue:#1d4ed8;--blue-dark:#1e3a8a;--blue-light:#eff6ff;
  --green:#16a34a;--red:#dc2626;--orange:#ea580c;--purple:#7c3aed;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;
  --gray-400:#94a3b8;--gray-600:#475569;--text:#0f172a;
  --font-hi:'Noto Sans Devanagari',sans-serif;
  --font-en:'Inter',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-en);background:#f0f4ff;color:var(--text);overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}

@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rippleOut{0%{transform:scale(0);opacity:.45}100%{transform:scale(5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .55s ease,transform .55s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

/* RIPPLE */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);animation:rippleOut .7s linear forwards;pointer-events:none;}

/* HEADER */
.header{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%);position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(30,58,138,.4);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--blue);flex-shrink:0;}
.logo-main{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;}
.logo-sub{font-size:10px;color:rgba(255,255,255,.75);font-family:var(--font-hi);}
.nav{display:flex;gap:4px;align-items:center;}
.nav a{color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;transition:background .2s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.nav a:hover{background:rgba(255,255,255,.18);color:#fff;}
.nav a i{font-size:11px;}
.hamburger{display:none;color:#fff;font-size:20px;cursor:pointer;padding:6px;}
@media(max-width:900px){
  .nav{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:rgba(30,58,138,.97);flex-direction:column;justify-content:flex-start;align-items:stretch;padding:20px;gap:4px;z-index:199;overflow-y:auto;}
  .nav.open{display:flex;}
  .nav a{font-size:15px;padding:12px 16px;border-radius:10px;}
  .hamburger{display:block;}
}

/* PAGE TITLE BAR */
.page-bar{background:#fff;border-bottom:1.5px solid var(--gray-200);padding:16px 20px;}
.page-bar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.page-bar-title{font-size:18px;font-weight:900;color:var(--text);font-family:var(--font-hi);display:flex;align-items:center;gap:8px;}
.page-bar-count{font-size:13px;color:var(--gray-400);font-family:var(--font-hi);}

/* JOBS SECTION */
.jobs-section{padding:20px 16px 60px;max-width:760px;margin:0 auto;}

/* JOB CARD */
.job-card{
  background:#fff;border-radius:18px;margin-bottom:16px;
  box-shadow:0 2px 16px rgba(30,58,138,.08);
  border:1.5px solid #e8edf5;overflow:hidden;
  animation:cardIn .45s ease both;
  transition:box-shadow .2s,transform .2s;
}
.job-card:hover{box-shadow:0 8px 32px rgba(30,58,138,.14);transform:translateY(-2px);}
.card-top{padding:16px 16px 12px;border-bottom:1px solid var(--gray-100);}
.card-new-badge{background:#059669;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;flex-shrink:0;letter-spacing:.5px;}
.card-title{font-size:15px;font-weight:800;color:var(--text);font-family:var(--font-hi);line-height:1.35;}
.card-dept{font-size:12px;color:var(--gray-600);margin-top:4px;margin-bottom:10px;display:flex;align-items:center;gap:5px;}

/* NOTICE TYPE BADGE */
.notice-type-badge{font-size:11px;font-weight:800;padding:3px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;}
.ntype-recruitment{background:#dcfce7;color:#15803d;}
.ntype-exam{background:#dbeafe;color:#1d4ed8;}
.ntype-admit{background:#ede9fe;color:#7c3aed;}
.ntype-result{background:#ffedd5;color:#ea580c;}
.ntype-correction{background:#fef3c7;color:#b45309;}
.ntype-answer{background:#ccfbf1;color:#0d9488;}

/* INFO GRID */
.card-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.info-item{background:#f8faff;border-radius:10px;padding:8px 10px;}
.info-label{font-size:10px;color:var(--gray-400);font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px;}
.info-value{font-size:13px;font-weight:700;color:var(--text);}
.info-value.blue{color:var(--blue);}
.info-value.red{color:var(--red);}
.info-value.green{color:#059669;}
.countdown-badge{display:inline-block;background:#fee2e2;color:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;}

/* DETAILS ROW */
.card-details-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.detail-chip{background:#f0f4ff;border-radius:8px;padding:6px 8px;font-size:11px;color:#475569;}
.detail-chip span{font-weight:700;color:#1e3a8a;display:block;font-size:12px;}

/* TAGS */
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;}

/* BUTTONS */
.btn-detail{width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;cursor:pointer;font-family:var(--font-hi);transition:all .2s;box-shadow:0 3px 12px rgba(30,58,138,.3);position:relative;overflow:hidden;}
.btn-detail:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(30,58,138,.4);}

/* STATES */
.jobs-loading{text-align:center;padding:60px 20px;color:var(--gray-600);}
.jobs-loading i{font-size:36px;color:var(--blue);display:block;margin-bottom:12px;animation:spin 1s linear infinite;}
.jobs-empty{text-align:center;padding:60px 20px;}
.jobs-empty i{font-size:48px;color:#cbd5e1;display:block;margin-bottom:12px;}
.jobs-empty h3{font-size:16px;color:#475569;margin-bottom:6px;font-family:var(--font-hi);}
.jobs-empty p{font-size:13px;color:var(--gray-400);font-family:var(--font-hi);}
.reload-btn{margin-top:16px;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-family:var(--font-hi);}

/* MOBILE */
@media(max-width:480px){
  .card-info-grid{grid-template-columns:1fr 1fr;}
  .card-details-row{grid-template-columns:1fr 1fr;}
  .card-title{font-size:14px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">LJ</div>
      <div>
        <div class="logo-main">Laxmi Job Alert</div>
        <div class="logo-sub">सरकारी नौकरी अलर्ट</div>
      </div>
    </a>
    <nav class="nav" id="mainNav">
      <a href="/"><i class="fas fa-home"></i> होम</a>
      <a href="departments.html"><i class="fas fa-sitemap"></i> विभाग</a>
      <a href="sarkari-jobs.html?src=ssc"><i class="fas fa-landmark"></i> SSC</a>
      <a href="sarkari-jobs.html?src=rsmssb"><i class="fas fa-star-of-david"></i> RSMSSB</a>
      <a href="sarkari-jobs.html?src=rssb"><i class="fas fa-shield-alt"></i> RSSB</a>
      <a href="sarkari-jobs.html?type=RESULT"><i class="fas fa-trophy"></i> रिजल्ट</a>
      <a href="sarkari-jobs.html?type=ADMIT_CARD"><i class="fas fa-id-card"></i> एडमिट कार्ड</a>
      <a href="sarkari-jobs.html?type=ANSWER_KEY"><i class="fas fa-key"></i> आंसर की</a>
      <a href="scholarship.html"><i class="fas fa-graduation-cap"></i> छात्रवृत्ति</a>
    </nav>
    <button class="hamburger" id="hamburger" onclick="document.getElementById('mainNav').classList.toggle('open')">
      <i class="fas fa-bars" id="hamburgerIcon"></i>
    </button>
  </div>
</header>

<!-- PAGE TITLE BAR -->
<div class="page-bar">
  <div class="page-bar-inner">
    <div class="page-bar-title" id="pageBarTitle">🔔 सरकारी नौकरियाँ</div>
    <div class="page-bar-count" id="pageBarCount"></div>
  </div>
</div>

<!-- FILTER BAR -->
<div id="filterBar" style="max-width:1100px;margin:0 auto;padding:18px 16px 0;"></div>

<!-- JOBS LIST -->
<div class="jobs-section" id="jobsContainer" style="max-width:1100px;">
  <div class="jobs-loading">
    <i class="fas fa-circle-notch"></i>
    <p style="font-family:var(--font-hi);">भर्तियां लोड हो रही हैं...</p>
  </div>
</div>

<!-- FIREBASE (read-only) + shared portal engine -->
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, initializeFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import * as Engine from './js/alert-data-engine.js';

const firebaseConfig = {
  apiKey:'AIzaSyD6fwR3EsspTbw7YJPQiSEGChdLBcOCEU8',
  authDomain:'newjobsarkari.firebaseapp.com',
  projectId:'newjobsarkari',
  storageBucket:'newjobsarkari.firebasestorage.app',
  messagingSenderId:'489662168900',
  appId:'1:489662168900:web:b214ef3f1269ef3a9de111'
};
const _app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
let db; try { db = initializeFirestore(_app, { experimentalAutoDetectLongPolling: true }); } catch (e) { db = getFirestore(_app); }

// ---- URL params (support both src and source) ----
const P = new URLSearchParams(location.search);
const rawSource = Engine.sanitizeParam(P.get('source') || P.get('src') || 'all').toLowerCase();
const rawType   = Engine.sanitizeParam(P.get('type') || '').toUpperCase();
const rawQ      = Engine.sanitizeParam(P.get('q') || '');

const TYPE_TO_CAT = { RECRUITMENT:'jobs', JOB:'jobs', VACANCY:'jobs', NEW_APPLICATION:'jobs',
  RESULT:'result', ADMIT_CARD:'admit', ANSWER_KEY:'answer', DATE_EXTENSION:'extension',
  SCHOLARSHIP:'scholarship', EXAM_SCHEDULE:'exam', CORRECTION:'other' };
const VALID_SRC = new Set(Engine.READABLE_SOURCE_IDS);   // registry-driven valid sources
const initial = {
  q: rawQ,
  type: (rawType && TYPE_TO_CAT[rawType]) ? TYPE_TO_CAT[rawType] : 'all',
  source: VALID_SRC.has(rawSource) ? rawSource : 'all'
};

// ---- page title ----
const cat = Engine.CAT_BY_ID[initial.type];
const srcLabel = (Engine.sourceById(initial.source)||{}).shortName;
let titleTxt = rawQ ? ('\u{1F50D} "'+rawQ+'" खोज परिणाम')
  : initial.type!=='all' ? (cat.icon+' '+cat.hi)
  : initial.source!=='all' ? ('\u{1F4CB} '+srcLabel+' सूचनाएं')
  : '\u{1F514} सभी सरकारी सूचनाएं';
document.getElementById('pageBarTitle').textContent = titleTxt;
document.title = titleTxt.replace(/[^ऀ-ॿ\w "]/gu,'').trim() + ' | Laxmi Job Alert';

const container = document.getElementById('jobsContainer');
const countEl = document.getElementById('pageBarCount');

function render(items){
  container.textContent='';
  if(!items.length){ container.appendChild(Engine.buildEmpty('कोई परिणाम नहीं मिला — फ़िल्टर बदलें')); countEl.textContent=''; return; }
  container.appendChild(Engine.buildGrid(items));
}
function renderError(){
  container.textContent='';
  container.appendChild(Engine.buildEmpty('डेटा लोड नहीं हो पाया, कृपया बाद में प्रयास करें'));
}

function showPartialWarn(){
  if(document.getElementById('partialWarn')) return;
  const w=document.createElement('div'); w.id='partialWarn';
  w.style.cssText='max-width:1100px;margin:8px auto 0;padding:9px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;color:#92400e;font-size:12.5px;font-family:var(--font-hi);';
  w.textContent='कुछ स्रोत अभी लोड नहीं हो पाए — उपलब्ध सूचनाएं दिखाई जा रही हैं।';
  container.parentNode.insertBefore(w, container);
}

(async ()=>{
  try{
    // registry-driven: read only existing collections; restrict if ?source= given
    const sources = (initial.source!=='all') ? [initial.source] : undefined;
    const { items, ok, failed } = await Engine.fetchAlerts(db, { sourceIds: sources, perCollection: 40 });
    if(ok===0){ renderError(); return; }           // every source failed (SDK + REST)
    if(failed>0 && items.length){ showPartialWarn(); }   // partial: some sources down, show the rest

    Engine.mountFilterBar(document.getElementById('filterBar'), {
      items,
      showSearch: true,
      initial,
      onChange: (filtered, state, isDefault) => {
        render(filtered);
        countEl.textContent = filtered.length ? (filtered.length + ' सूचनाएं') : '';
      }
    });
  }catch(e){ renderError(); }
})();

document.getElementById('hamburger').addEventListener('click', ()=>{
  const open=document.getElementById('mainNav').classList.contains('open');
  document.getElementById('hamburgerIcon').className=open?'fas fa-bars':'fas fa-times';
});
</script>
</body>
</html>
