<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>भर्ती विवरण | Laxmi Job Alert</title>
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:#f4f6f9;color:#1a1a2e;line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}

/* HEADER */
.site-header{background:#fff;border-bottom:3px solid #1d4ed8;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:200;}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:62px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:40px;height:40px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;}
.logo-title{font-size:18px;font-weight:800;color:#1e3a8a;}
.logo-title span{color:#f59e0b;}
.logo-sub{font-size:10px;color:#64748b;font-family:'Noto Sans Devanagari',sans-serif;}
.btn-back{display:flex;align-items:center;gap:7px;background:#eff6ff;color:#1d4ed8;border:1.5px solid #bfdbfe;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;transition:.2s;}
.btn-back:hover{background:#dbeafe;}

/* BREADCRUMB */
.breadcrumb-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;}
.breadcrumb{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#64748b;flex-wrap:wrap;}
.breadcrumb a{color:#1d4ed8;font-weight:600;}
.breadcrumb a:hover{text-decoration:underline;}
.breadcrumb .sep{color:#cbd5e1;}

/* MAIN LAYOUT */
.main-wrap{max-width:900px;margin:24px auto;padding:0 20px 60px;}

/* CATEGORY BANNER */
.post-category-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.cat-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 14px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase;}
.cat-rec{background:#dcfce7;color:#15803d;}
.cat-exam{background:#dbeafe;color:#1d4ed8;}
.cat-admit{background:#ede9fe;color:#7c3aed;}
.cat-result{background:#ffedd5;color:#ea580c;}
.cat-ak{background:#ccfbf1;color:#0d9488;}
.cat-corr{background:#fef3c7;color:#b45309;}
.cat-other{background:#f1f5f9;color:#475569;}
.badge-new-post{background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:5px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* POST TITLE */
.post-title{font-size:clamp(20px,4vw,30px);font-weight:900;color:#0f172a;line-height:1.3;margin-bottom:10px;font-family:'Noto Sans Devanagari',sans-serif;}

/* POST META */
.post-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#64748b;padding:12px 0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;margin-bottom:20px;}
.post-meta-item{display:flex;align-items:center;gap:5px;}
.post-meta-item i{color:#1d4ed8;font-size:12px;}
.dept-chip{background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;padding:3px 10px;border-radius:5px;border:1px solid #bfdbfe;}

/* FEATURED BANNER */
.post-banner{border-radius:14px;padding:28px 32px;margin-bottom:24px;position:relative;overflow:hidden;}
.post-banner.blue{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#0ea5e9 100%);}
.post-banner.purple{background:linear-gradient(135deg,#4c1d95 0%,#7c3aed 60%,#a78bfa 100%);}
.post-banner.green{background:linear-gradient(135deg,#14532d 0%,#16a34a 60%,#4ade80 100%);}
.post-banner.gray{background:linear-gradient(135deg,#334155 0%,#475569 60%,#94a3b8 100%);}
.post-banner::before{content:'';position:absolute;right:-20px;top:-20px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%;}
.post-banner::after{content:'';position:absolute;right:40px;bottom:-30px;width:100px;height:100px;background:rgba(255,255,255,.04);border-radius:50%;}
.banner-icon{font-size:48px;margin-bottom:10px;position:relative;z-index:1;}
.banner-title{font-size:clamp(14px,2.5vw,18px);font-weight:800;color:#fff;font-family:'Noto Sans Devanagari',sans-serif;line-height:1.4;position:relative;z-index:1;}
.banner-dept{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px;position:relative;z-index:1;}
.banner-stats{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1;}
.banner-stat{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 16px;backdrop-filter:blur(4px);}
.banner-stat-label{font-size:10px;color:rgba(255,255,255,.7);font-weight:600;margin-bottom:3px;}
.banner-stat-value{font-size:16px;font-weight:900;color:#fff;}
.banner-stat-value.yellow{color:#fbbf24;}
.banner-stat-value.red-light{color:#fca5a5;}

/* ARTICLE CARD */
.article-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.article-card-head{padding:16px 20px;border-bottom:1px solid #e8edf5;display:flex;align-items:center;gap:10px;}
.article-card-head h3{font-size:15px;font-weight:800;color:#1e3a8a;font-family:'Noto Sans Devanagari',sans-serif;}
.article-card-head .head-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.article-card-body{padding:20px;}

/* IMPORTANT DATES TABLE (WordPress-style) */
.dates-table{width:100%;border-collapse:collapse;}
.dates-table thead tr{background:#1e3a8a;}
.dates-table thead th{color:#fff;font-size:12px;font-weight:700;padding:11px 14px;text-align:left;letter-spacing:.3px;text-transform:uppercase;}
.dates-table tbody tr{border-bottom:1px solid #f1f5f9;transition:background .15s;}
.dates-table tbody tr:hover{background:#f8faff;}
.dates-table tbody tr:last-child{border-bottom:none;}
.dates-table tbody td{padding:11px 14px;font-size:13.5px;color:#334155;}
.dates-table tbody td:first-child{font-weight:600;color:#1e3a8a;width:45%;}
.dates-table tbody td:last-child{font-weight:700;}
.dates-table .td-red{color:#dc2626;}
.dates-table .td-green{color:#16a34a;}
.dates-table .td-blue{color:#1d4ed8;}
.dates-table .td-warn{color:#d97706;}

/* VACANCY TABLE */
.vacancy-table{width:100%;border-collapse:collapse;}
.vacancy-table thead tr{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);}
.vacancy-table thead th{color:#fff;font-size:12px;font-weight:700;padding:10px 14px;text-align:left;letter-spacing:.3px;}
.vacancy-table tbody tr{border-bottom:1px solid #f1f5f9;}
.vacancy-table tbody tr:hover{background:#f8faff;}
.vacancy-table tbody td{padding:10px 14px;font-size:13px;color:#334155;}
.vacancy-table tfoot tr{background:#eff6ff;}
.vacancy-table tfoot td{padding:10px 14px;font-size:13.5px;font-weight:800;color:#1e3a8a;}

/* FEE TABLE */
.fee-table{width:100%;border-collapse:collapse;}
.fee-table tr{border-bottom:1px solid #f1f5f9;}
.fee-table tr:last-child{border-bottom:none;}
.fee-table td{padding:11px 14px;font-size:13.5px;}
.fee-table td:first-child{color:#475569;font-weight:500;}
.fee-table td:last-child{font-weight:800;color:#1d4ed8;text-align:right;}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.info-cell{background:#f8faff;border-radius:10px;padding:12px 14px;border:1px solid #e8edf5;}
.info-cell-label{font-size:10.5px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.info-cell-value{font-size:14px;font-weight:700;color:#0f172a;}

/* STEP LIST */
.step-list{display:flex;flex-direction:column;gap:10px;}
.step-item{display:flex;align-items:flex-start;gap:12px;background:#f8faff;border-radius:10px;padding:13px 14px;border-left:3px solid #1d4ed8;}
.step-num{width:28px;height:28px;border-radius:50%;background:#1d4ed8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:1px;}
.step-text{font-size:13.5px;color:#1e293b;font-weight:500;line-height:1.5;}

/* NOTICE BOX */
.notice-box{border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:0;}
.notice-box.warn{background:#fffbeb;border:1px solid #fde68a;}
.notice-box.info{background:#eff6ff;border:1px solid #bfdbfe;}
.notice-box.success{background:#f0fdf4;border:1px solid #bbf7d0;}
.notice-box-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.notice-box-text{font-size:13px;color:#334155;line-height:1.6;font-family:'Noto Sans Devanagari',sans-serif;}
.notice-box-text b{display:block;margin-bottom:4px;font-size:13.5px;}

/* AI SUMMARY */
.ai-block{background:linear-gradient(135deg,#eff6ff,#e0f2fe);border:1.5px solid #bfdbfe;border-radius:12px;padding:16px 18px;margin-bottom:20px;}
.ai-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:10px;}
.ai-text{font-size:13.5px;color:#334155;line-height:1.75;font-family:'Noto Sans Devanagari',sans-serif;}

/* IMPORTANT LINKS (WordPress sidebar-style) */
.links-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.links-head{background:#1e3a8a;padding:14px 18px;color:#fff;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.link-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #f1f5f9;transition:background .15s;}
.link-row:last-child{border-bottom:none;}
.link-row:hover{background:#f8faff;}
.link-row-left{display:flex;align-items:center;gap:12px;}
.link-row-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.link-row-title{font-size:13.5px;font-weight:700;color:#1e293b;}
.link-row-sub{font-size:11px;color:#94a3b8;margin-top:2px;}
.link-row-arrow{color:#94a3b8;font-size:14px;}

/* ACTION BUTTONS */
.action-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.btn-main{flex:1;min-width:160px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:800;font-family:'Noto Sans Devanagari',sans-serif;cursor:pointer;border:none;transition:.2s;text-align:center;}
.btn-apply-main{background:linear-gradient(135deg,#059669,#047857);color:#fff;box-shadow:0 4px 16px rgba(5,150,105,.3);}
.btn-apply-main:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(5,150,105,.4);}
.btn-pdf-main{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 3px 12px rgba(220,38,38,.25);}
.btn-pdf-main:hover{transform:translateY(-1px);}
.btn-share-main{background:linear-gradient(135deg,#25d366,#1da851);color:#fff;box-shadow:0 3px 12px rgba(37,211,102,.25);}
.btn-share-main:hover{transform:translateY(-1px);}
.btn-disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;opacity:.7;}

/* TAGS */
.tags-section{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:16px 0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;}
.tags-label{font-size:12px;font-weight:700;color:#64748b;margin-right:4px;}
.tag{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:20px;transition:.15s;}
.tag:hover{background:#dbeafe;}

/* SHARE SECTION */
.share-section{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:20px;text-align:center;margin-bottom:20px;}
.share-title{font-size:14px;font-weight:800;color:#0f172a;margin-bottom:14px;font-family:'Noto Sans Devanagari',sans-serif;}
.share-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.share-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:.2s;}
.share-wa{background:#25d366;color:#fff;}
.share-tg{background:#229ED9;color:#fff;}
.share-copy{background:#f1f5f9;color:#475569;}
.share-btn:hover{opacity:.88;transform:translateY(-1px);}

/* RELATED / FOOTER NOTE */
.post-footer{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:20px;margin-bottom:20px;}
.disclaimer-text{font-size:12px;color:#94a3b8;line-height:1.7;font-family:'Noto Sans Devanagari',sans-serif;}

/* LOADING */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:#64748b;}
.page-loading .spin{font-size:36px;color:#1d4ed8;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.page-error{text-align:center;padding:60px 20px;background:#fff;border-radius:14px;}
.page-error i{font-size:48px;color:#fca5a5;margin-bottom:12px;}

/* WHATSAPP FLOAT */
.wa-float{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:500;box-shadow:0 6px 20px rgba(37,211,102,.45);text-decoration:none;transition:.2s;}
.wa-float:hover{transform:scale(1.1);}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:#fff;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(30,58,138,.18);border-left:4px solid #059669;z-index:9999;opacity:0;pointer-events:none;min-width:220px;transition:opacity .3s,transform .3s;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* RESPONSIVE */
@media(max-width:600px){
  .main-wrap{padding:0 12px 60px;}
  .info-grid{grid-template-columns:1fr;}
  .banner-stats{gap:10px;}
  .action-strip{flex-direction:column;}
  .btn-main{min-width:100%;}
  .header-inner{padding:0 14px;}
  .post-banner{padding:20px 18px;}
}
</style>
</head>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey:'AIzaSyD6fwR3EsspTbw7YJPQiSEGChdLBcOCEU8',
  authDomain:'newjobsarkari.firebaseapp.com',
  projectId:'newjobsarkari',
  storageBucket:'newjobsarkari.firebasestorage.app',
  messagingSenderId:'489662168900',
  appId:'1:489662168900:web:b214ef3f1269ef3a9de111',
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db  = getFirestore(app);

const hashParts = decodeURIComponent(location.hash.slice(1)).split('||');
const docId  = hashParts[0] || null;
const colName= hashParts[1] || 'ssc_jobs';

async function loadJob() {
  const wrap = document.getElementById('pageWrap');
  if (!docId) { wrap.innerHTML = errHTML('कोई भर्ती ID नहीं मिली।'); return; }
  try {
    const snap = await getDoc(doc(db, colName, docId));
    if (!snap.exists()) { wrap.innerHTML = errHTML('यह भर्ती नहीं मिली।'); return; }
    let job = { id: snap.id, ...snap.data(), _col: colName };
    if (colName === 'alerts') job = adaptAlert(job);   // map manual-alert fields to renderer shape
    wrap.innerHTML = buildPage(job);
    if (colName === 'alerts') appendAlertDisclaimer();
    updateMeta(job);
  } catch(e) {
    console.error(e);
    wrap.innerHTML = errHTML('लोड नहीं हुआ। इंटरनेट चेक करें।');
  }
}
loadJob();

// Adapter: a manual `alerts` doc -> the field names buildPage() expects.
function adaptAlert(a) {
  return {
    id: a.id, _col: 'alerts',
    post_name: a.title || '',
    notice_type: String(a.alertType || 'PUBLIC_NOTICE').toUpperCase(),
    department: a.department || a.sourceHindiName || a.sourceLabel || '',
    official_pdf: a.officialPdf || a.officialUrl || '',
    apply_link: a.applyUrl || '',
    last_date: a.lastDate || '',
    form_start_date: a.startDate || '',
    exam_date: a.examDate || '',
    result_date: a.resultDate || '',
    objection_end_date: a.objectionEndDate || '',
    qualification: Array.isArray(a.qualification) ? a.qualification.join(', ') : (a.qualification || ''),
    required_documents: Array.isArray(a.requiredDocuments) ? a.requiredDocuments : [],
    ai_summary: a.description || '',
    source: a.officialUrl || a.sourceLabel || '',
    published_at: a.publishedAt || a.updatedAt || null,
    tags: []
  };
}

// Required disclaimer for manual alerts (safe DOM, no innerHTML with data).
function appendAlertDisclaimer() {
  const wrap = document.getElementById('pageWrap');
  if (!wrap || document.getElementById('alertDisclaimer')) return;
  const box = document.createElement('div');
  box.id = 'alertDisclaimer';
  box.style.cssText = 'max-width:760px;margin:18px auto 0;padding:14px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;color:#92400e;font-size:13px;line-height:1.6;font-family:"Noto Sans Devanagari",sans-serif;';
  const i = document.createElement('i'); i.className = 'fas fa-circle-info'; i.style.marginInlineEnd = '8px';
  box.appendChild(i);
  box.appendChild(document.createTextNode('यह सूचना official source के आधार पर दी गई है। आवेदन/लाभ लेने से पहले official notification जरूर देखें।'));
  wrap.appendChild(box);
}

// ══════════════════════════════════════════════
//  BUILD PAGE
// ══════════════════════════════════════════════
function buildPage(job) {
  const ntype  = job.notice_type || 'RECRUITMENT';
  const title  = v(job.post_name || job.job_title);
  const dept   = v(job.department || srcLabel(job._col));
  const pdfUrl = job.official_pdf || job.pdf_url || null;
  const aiSum  = v(job.ai_summary);
  const tags   = Array.isArray(job.tags) ? job.tags : [];
  const isNew  = isRecent(job.published_at);
  const src    = job._col || '';

  document.getElementById('breadcrumbTitle').textContent = title;

  const catInfo = getCatInfo(ntype);
  const bannerClass = { ssc_jobs:'blue', rsmssb_jobs:'purple', rssb_jobs:'green' }[src] || 'gray';
  const bannerIcon  = { ssc_jobs:'🏛️', rsmssb_jobs:'⭐', rssb_jobs:'🛡️' }[src] || '📋';

  const shareText = encodeURIComponent(`🔔 ${title}\n📋 ${dept}\n\nLaxmi Job Alert — newjobsarkari.web.app\n📞 6350270167`);
  const pageUrl   = encodeURIComponent(window.location.href);

      <button class="share-btn share-copy" onclick="copyLink()"><i class="fas fa-link"></i> लिंक कॉपी करें</button>

  /* ── DISCLAIMER ── */

// ══════════════════════════════════════════════
//  BANNER STATS
// ══════════════════════════════════════════════
function buildBannerStats(job, ntype) {
  if (ntype === 'RECRUITMENT') {
    const posts    = v(job.total_posts);
    const lastDate = v(job.last_date);
    const feeGen   = v(job.fees_general || job.fees);
    return `
      <div class="banner-stat"><div class="banner-stat-label">कुल पद</div><div class="banner-stat-value yellow">${e(posts)}</div></div>
      <div class="banner-stat"><div class="banner-stat-label">अंतिम तिथि</div><div class="banner-stat-value red-light">${e(lastDate)}</div></div>
      <div class="banner-stat"><div class="banner-stat-label">आवेदन शुल्क</div><div class="banner-stat-value">${e(feeGen)}</div></div>`;
  }
  if (ntype === 'EXAM_SCHEDULE') return `
    <div class="banner-stat"><div class="banner-stat-label">परीक्षा शुरू</div><div class="banner-stat-value yellow">${e(v(job.exam_start_date))}</div></div>
    <div class="banner-stat"><div class="banner-stat-label">परीक्षा समाप्त</div><div class="banner-stat-value">${e(v(job.exam_end_date))}</div></div>`;
  if (ntype === 'ADMIT_CARD') return `
    <div class="banner-stat"><div class="banner-stat-label">परीक्षा तिथि</div><div class="banner-stat-value yellow">${e(v(job.exam_date))}</div></div>
    <div class="banner-stat"><div class="banner-stat-label">उपलब्ध से</div><div class="banner-stat-value">${e(v(job.admit_card_available_from))}</div></div>`;
  if (ntype === 'RESULT') return `
    <div class="banner-stat"><div class="banner-stat-label">परिणाम तिथि</div><div class="banner-stat-value yellow">${e(v(job.result_date))}</div></div>
    <div class="banner-stat"><div class="banner-stat-label">चयनित</div><div class="banner-stat-value">${e(v(job.total_selected))}</div></div>`;
  if (ntype === 'ANSWER_KEY') return `
    <div class="banner-stat"><div class="banner-stat-label">आपत्ति शुरू</div><div class="banner-stat-value yellow">${e(v(job.objection_start_date))}</div></div>
    <div class="banner-stat"><div class="banner-stat-label">आपत्ति अंत</div><div class="banner-stat-value red-light">${e(v(job.objection_end_date))}</div></div>`;
  if (ntype === 'CORRECTION') return `
    <div class="banner-stat"><div class="banner-stat-label">सुधार शुरू</div><div class="banner-stat-value yellow">${e(v(job.correction_start_date))}</div></div>
    <div class="banner-stat"><div class="banner-stat-label">अंतिम तिथि</div><div class="banner-stat-value red-light">${e(v(job.correction_end_date))}</div></div>`;
  return '';
}

    }

  } else if (ntype === 'ADMIT_CARD') {
    html += articleCard('📅 Admit Card विवरण', '#ede9fe', `
      <table class="dates-table">
        <thead><tr><th>विवरण</th><th>तिथि</th></tr></thead>

    html += articleCard('⬇️ Admit Card Download कैसे करें?', '#f0fdf4', `

        <div class="step-item"><div class="step-num">1</div><div class="step-text">आधिकारिक वेबसाइट <b>${e(srcSite(job._col))}</b> पर जाएं।</div></div>

        <thead><tr><th>विवरण</th><th>जानकारी</th></tr></thead>

  return html;
}

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function articleCard(heading, headBg, bodyHtml) {
  return `
  <div class="article-card">
    <div class="article-card-head" style="background:${headBg}">
      <h3>${heading}</h3>
    </div>
    <div class="article-card-body">${bodyHtml}</div>
  </div>`;
}

function row(label, val, cls) {
  if (val === 'उपलब्ध नहीं') return `<tr><td>${e(label)}</td><td style="color:#94a3b8">—</td></tr>`;
  return `<tr><td>${e(label)}</td><td class="${cls}">${e(val)}</td></tr>`;
}

function getCatInfo(ntype) {
  const map = {
    RECRUITMENT:   { cls:'cat-rec',   ico:'fa-solid fa-pen-to-square', label:'नई भर्ती',        action:'ऑनलाइन आवेदन करें' },
    EXAM_SCHEDULE: { cls:'cat-exam',  ico:'fa-solid fa-calendar-days', label:'परीक्षा तिथि',     action:'परीक्षा शेड्यूल देखें' },
    ADMIT_CARD:    { cls:'cat-admit', ico:'fa-solid fa-id-card',       label:'एडमिट कार्ड',     action:'Admit Card डाउनलोड करें' },
    RESULT:        { cls:'cat-result',ico:'fa-solid fa-trophy',        label:'परिणाम',           action:'परिणाम देखें' },
    ANSWER_KEY:    { cls:'cat-ak',    ico:'fa-solid fa-key',           label:'आंसर की',          action:'Answer Key देखें' },
    CORRECTION:    { cls:'cat-corr',  ico:'fa-solid fa-pen',           label:'सुधार',            action:'सुधार विंडो खोलें' },
  };
  return map[ntype] || { cls:'cat-other', ico:'fa-solid fa-circle-info', label:'अन्य', action:'विवरण देखें' };
}

function getActionLink(job, ntype) {
  if (ntype==='RECRUITMENT')   return job.apply_link && job.apply_link!=='उपलब्ध नहीं' ? job.apply_link : null;
  if (ntype==='EXAM_SCHEDULE') return job.schedule_link && job.schedule_link!=='उपलब्ध नहीं' ? job.schedule_link : null;
  if (ntype==='ADMIT_CARD')    return job.admit_card_link && job.admit_card_link!=='उपलब्ध नहीं' ? job.admit_card_link : null;
  if (ntype==='RESULT')        return job.result_link && job.result_link!=='उपलब्ध नहीं' ? job.result_link : null;
  if (ntype==='ANSWER_KEY')    return job.answer_key_link && job.answer_key_link!=='उपलब्ध नहीं' ? job.answer_key_link : null;
  if (ntype==='CORRECTION')    return job.correction_link && job.correction_link!=='उपलब्ध नहीं' ? job.correction_link : null;
  return null;
}

function srcLabel(col) {
  if (!col) return 'सरकारी';
  if (col.includes('ssc'))    return 'SSC';
  if (col.includes('rsmssb')) return 'RSMSSB';
  if (col.includes('rssb'))   return 'RSSB';
  return col.split('_')[0].toUpperCase();
}

function srcSite(col) {
  if (col==='rsmssb_jobs') return 'rsmssb.rajasthan.gov.in';
  if (col==='rssb_jobs')   return 'rssb.rajasthan.gov.in';
  return 'ssc.gov.in';
}

function v(val) {
  if (!val) return 'उपलब्ध नहीं';
  const s = String(val).trim();
  return (s===''||s==='Not Available'||s==='NA'||s==='N/A') ? 'उपलब्ध नहीं' : s;
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}

function isRecent(publishedAt) {
  if (!publishedAt) return false;
  const ts = publishedAt.seconds ? new Date(publishedAt.seconds*1000) : new Date(publishedAt);
  return (Date.now()-ts) < 7*24*3600*1000;
}

function formatDate(publishedAt) {
  if (!publishedAt) return null;
  try {
    const d = publishedAt.seconds ? new Date(publishedAt.seconds*1000) : new Date(publishedAt);
    return d.toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric'});
  } catch(e) { return null; }
}

function updateMeta(job) {
  const t = job.post_name || job.job_title || 'भर्ती विवरण';
  document.title = t + ' | Laxmi Job Alert';
  document.getElementById('breadcrumbTitle').textContent = t;
}

function errHTML(msg) {
  return `<div class="page-error">
    <i class="fas fa-triangle-exclamation"></i>
    <h3 style="color:#475569;margin-bottom:10px;font-family:'Noto Sans Devanagari',sans-serif">${msg}</h3>
    <a href="sarkari-jobs.html" style="color:#1d4ed8;font-weight:700">← सभी भर्तियां देखें</a>
  </div>`;
}
</script>

<script>
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(()=>{
    const t = document.getElementById('toast');
    document.getElementById('tIcon').textContent = '✅';
    document.getElementById('tMsg').textContent  = 'लिंक कॉपी हो गया!';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2500);
  });
}
</script>
